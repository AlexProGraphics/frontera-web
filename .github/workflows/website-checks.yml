name: Website checks (no deployment)

on:
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/check-site.py'
      - '.github/workflows/website-checks.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/check-site.py'
      - '.github/workflows/website-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check static pages, assets and fragment links
        run: python3 scripts/check-site.py
